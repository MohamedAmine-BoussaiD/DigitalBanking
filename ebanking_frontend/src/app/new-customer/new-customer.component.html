<div class="container">
  <div class="card col-md-6 offset-3">
    <div class="card-header">
      New Customer
    </div>
    <div  class="card-body">
      <div *ngIf="newCustomerForm">
        <form [formGroup]="newCustomerForm"  (ngSubmit)="handleNewCustomer()" ]>
          <div class="mb-3">
            <label class="input-group-text"> Name </label>
            <input type="text" class="form-control" formControlName="name">
          </div>
          <div class="mb-3">
            <label class="input-group-text"> Email </label>
            <input type="text" class="form-control" formControlName="email">
          </div>
          <button [disabled]="!newCustomerForm.valid" class="btn btn-info">
            Submit
          </button>

        </form>

      </div>

    </div>

  </div>

</div>
